name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: author_book
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d author_book"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint backend
        run: flake8 .

      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-only-insecure-key-do-not-use-in-production' }}
          POSTGRES_DB: author_book
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: python manage.py test

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/author-book-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/author-book-frontend:latest

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy, smoke test, and rollback on failure
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/author-book-backend:latest
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/author-book-frontend:latest
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,BACKEND_IMAGE,FRONTEND_IMAGE,STAGING_SECRET_KEY,STAGING_POSTGRES_PASSWORD
          script: |
            set -eu
            app_dir=/opt/author-book
            compose_file="$app_dir/docker-compose.staging.yml"
            mkdir -p "$app_dir"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" --password-stdin

            previous_backend=false
            previous_frontend=false
            if docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
              docker tag "$BACKEND_IMAGE" "${BACKEND_IMAGE%:*}:previous"
              previous_backend=true
            fi
            if docker image inspect "$FRONTEND_IMAGE" >/dev/null 2>&1; then
              docker tag "$FRONTEND_IMAGE" "${FRONTEND_IMAGE%:*}:previous"
              previous_frontend=true
            fi

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            cat > "$compose_file" <<EOF
            services:
              db:
                image: postgres:16-alpine
                environment:
                  POSTGRES_DB: author_book
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: \${STAGING_POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres -d author_book"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              backend:
                image: $BACKEND_IMAGE
                environment:
                  DJANGO_SETTINGS_MODULE: config.settings.dev
                  SECRET_KEY: \${STAGING_SECRET_KEY}
                  POSTGRES_DB: author_book
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: \${STAGING_POSTGRES_PASSWORD}
                  POSTGRES_HOST: db
                  POSTGRES_PORT: 5432
                command: >
                  sh -c "python manage.py migrate &&
                         python manage.py runserver 0.0.0.0:8000"
                ports:
                  - "8000:8000"
                depends_on:
                  db:
                    condition: service_healthy
              frontend:
                image: $FRONTEND_IMAGE
                ports:
                  - "5173:80"
                depends_on:
                  - backend
            volumes:
              postgres_data:
            EOF

            docker compose -f "$compose_file" up -d
            smoke_test() {
              curl --fail --silent --show-error --retry 12 --retry-delay 5 \
                http://127.0.0.1:8000/admin/login/ >/dev/null &&
              curl --fail --silent --show-error --retry 12 --retry-delay 5 \
                http://127.0.0.1:5173/ >/dev/null
            }

            if ! smoke_test; then
              docker compose -f "$compose_file" down
              if [ "$previous_backend" = true ] && [ "$previous_frontend" = true ]; then
                docker tag "${BACKEND_IMAGE%:*}:previous" "$BACKEND_IMAGE"
                docker tag "${FRONTEND_IMAGE%:*}:previous" "$FRONTEND_IMAGE"
                docker compose -f "$compose_file" up -d
              else
                echo "Smoke test failed on the first deployment; no previous images exist."
              fi
              exit 1
            fi

      