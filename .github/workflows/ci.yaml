name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: author_book
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d author_book"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint backend
        run: flake8 .

      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-only-insecure-key-do-not-use-in-production' }}
          POSTGRES_DB: author_book
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: python manage.py test

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # - name: Run frontend tests
      #   working-directory: frontend
      #   run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/author-book-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/author-book-frontend:latest

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy, smoke test, and rollback on failure
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/author-book-backend:latest
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/author-book-frontend:latest
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER || 'postgres' }}
          STAGING_POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB || 'author_book' }}
          STAGING_ALLOWED_HOSTS: ${{ secrets.SERVER_HOST }}
          STAGING_CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,BACKEND_IMAGE,FRONTEND_IMAGE,STAGING_SECRET_KEY,STAGING_POSTGRES_PASSWORD,STAGING_POSTGRES_USER,STAGING_POSTGRES_DB,STAGING_ALLOWED_HOSTS,STAGING_CORS_ALLOWED_ORIGINS
          script: |
            set -eu
            app_dir=/opt/author-book
            compose_file="$app_dir/docker-compose.staging.yml"
            env_file="$app_dir/.env.staging"
            mkdir -p "$app_dir"

            cors_origins="${STAGING_CORS_ALLOWED_ORIGINS:-http://${STAGING_ALLOWED_HOSTS},http://localhost,http://127.0.0.1}"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" --password-stdin
            printf 'STAGING_SECRET_KEY=%s\nSTAGING_POSTGRES_PASSWORD=%s\nSTAGING_POSTGRES_USER=%s\nSTAGING_POSTGRES_DB=%s\nALLOWED_HOSTS=%s\nCORS_ALLOWED_ORIGINS=%s\n' \
              "$STAGING_SECRET_KEY" "$STAGING_POSTGRES_PASSWORD" "$STAGING_POSTGRES_USER" "$STAGING_POSTGRES_DB" \
              "$STAGING_ALLOWED_HOSTS,127.0.0.1,localhost" \
              "$cors_origins" > "$env_file"
            chmod 600 "$env_file"

            previous_backend=false
            previous_frontend=false
            if docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
              docker tag "$BACKEND_IMAGE" "${BACKEND_IMAGE%:*}:previous"
              previous_backend=true
            fi
            if docker image inspect "$FRONTEND_IMAGE" >/dev/null 2>&1; then
              docker tag "$FRONTEND_IMAGE" "${FRONTEND_IMAGE%:*}:previous"
              previous_frontend=true
            fi

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            cat > "$compose_file" <<EOF
            services:
              db:
                image: postgres:16-alpine
                environment:
                  POSTGRES_DB: \${STAGING_POSTGRES_DB}
                  POSTGRES_USER: \${STAGING_POSTGRES_USER}
                  POSTGRES_PASSWORD: \${STAGING_POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \${STAGING_POSTGRES_USER} -d \${STAGING_POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              backend:
                image: $BACKEND_IMAGE
                environment:
                  DJANGO_SETTINGS_MODULE: config.settings.dev
                  SECRET_KEY: \${STAGING_SECRET_KEY}
                  ALLOWED_HOSTS: \${ALLOWED_HOSTS}
                  CORS_ALLOWED_ORIGINS: \${CORS_ALLOWED_ORIGINS}
                  POSTGRES_DB: \${STAGING_POSTGRES_DB}
                  POSTGRES_USER: \${STAGING_POSTGRES_USER}
                  POSTGRES_PASSWORD: \${STAGING_POSTGRES_PASSWORD}
                  POSTGRES_HOST: db
                  POSTGRES_PORT: 5432
                volumes:
                  - media_data:/app/media
                command: >
                  sh -c "python manage.py migrate &&
                         python manage.py runserver 0.0.0.0:8000"
                depends_on:
                  db:
                    condition: service_healthy
              frontend:
                image: $FRONTEND_IMAGE
                ports:
                  - "80:80"
                depends_on:
                  backend:
                    condition: service_started
            volumes:
              postgres_data:
              media_data:
            EOF

            docker compose --env-file "$env_file" -f "$compose_file" up -d
            smoke_test() {
              backend_ready=false
              frontend_ready=false
              for attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1/admin/login/ >/dev/null 2>&1; then
                  backend_ready=true
                  break
                fi
                sleep 3
              done
              for attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1/ >/dev/null 2>&1; then
                  frontend_ready=true
                  break
                fi
                sleep 3
              done
              [ "$backend_ready" = true ] && [ "$frontend_ready" = true ]
            }

            if ! smoke_test; then
              docker compose --env-file "$env_file" -f "$compose_file" down
              if [ "$previous_backend" = true ] && [ "$previous_frontend" = true ]; then
                docker tag "${BACKEND_IMAGE%:*}:previous" "$BACKEND_IMAGE"
                docker tag "${FRONTEND_IMAGE%:*}:previous" "$FRONTEND_IMAGE"
                docker compose --env-file "$env_file" -f "$compose_file" up -d
              else
                echo "Smoke test failed on the first deployment; no previous images exist."
              fi
              exit 1
            fi

      