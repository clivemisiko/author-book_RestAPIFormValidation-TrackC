version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
